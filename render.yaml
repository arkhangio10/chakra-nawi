# Blueprint de Render para la API + panel (ver api/README.md, sección "Desplegar").
# En Render: New > Blueprint > elegir este repositorio. Los valores con sync: false se piden al crear el servicio.
services:
  - type: web
    name: chakra-nawi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: virginia          # la región de Render más cercana a Lima
    plan: starter             # el disco persistente exige un plan pago (el plan free no admite discos)
    healthCheckPath: /salud
    autoDeploy: true
    disk:
      name: datos
      mountPath: /data        # SQLite, fotos de los casos y (opcional) fincas_privadas.json
      sizeGB: 1
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # {"LC-001": {"telefono": "+519XXXXXXXX", "idioma": "quz"}, ...} — teléfonos solo aquí (Ley 29733)
      - key: CHAKRA_FINCAS_PRIVADAS_JSON
        sync: false
      - key: CHAKRA_DB
        value: /data/chakra.sqlite
      - key: CHAKRA_FOTOS
        value: /data/uploads
      - key: CHAKRA_FINCAS_PRIVADAS
        value: /data/fincas_privadas.json
      # PUBLIC_BASE_URL no hace falta: la API usa RENDER_EXTERNAL_URL, que Render define solo.
      # Ponerla solo si se usa un dominio propio.
